; Upload-Grenzen fuer den Webspace.
;
; PHP wirft eine zu grosse Datei weg, bevor Laravel sie ueberhaupt sieht: der
; Upload kommt als UPLOAD_ERR_INI_SIZE an, die Datei ist dann leer, und die
; Regel `image` in MediaController meldet nur noch, das sei kein Bild. Der
; Fehler zeigt also auf das Foto und nicht auf die Ursache.
;
; Diese Datei greift nur, wenn PHP als FPM oder CGI laeuft - so wie bei netcup.
; Unter mod_php waere sie wirkungslos; die Werte muessten dann im WCP unter
; PHP-Einstellungen stehen. Aenderungen wirken erst nach bis zu fuenf Minuten
; (user_ini.cache_ttl).
;
; `max_file_uploads` fehlt hier mit Absicht: die Einstellung ist PHP_INI_SYSTEM
; und laesst sich per .user.ini nicht setzen. Der Standard ist 20 und passt
; damit genau zu `files => max:20` im MediaController.

; MediaController erlaubt 24 MB je Datei - PHP muss darueber liegen, damit die
; Regel der Anwendung die engere von beiden ist und eine verstaendliche
; Meldung liefert.
upload_max_filesize = 32M

; Muss den ganzen Stapel fassen, nicht die einzelne Datei: die Verwaltung nimmt
; bis zu 20 Bilder auf einmal entgegen.
post_max_size = 256M

; Ein Foto wird zum Rechnen als Bitmap ausgepackt: Breite mal Hoehe mal 4 Byte.
; 12 Megapixel sind so rund 50 MB, 48 Megapixel rund 200 MB - dazu kommen die
; verkleinerten Kopien.
memory_limit = 512M

; Zeit zum Empfangen des Uploads und zum Rechnen danach. Die Bildvarianten
; entstehen synchron, weil der Queue-Worker auf dem Shared Hosting nur einmal
; pro Minute laeuft.
max_input_time = 300
max_execution_time = 300
